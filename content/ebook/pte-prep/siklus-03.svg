<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="600" height="400" fill="#FFFFFF"/>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#333333"/>
    </marker>
  </defs>

  <text x="300" y="30" font-size="18" font-weight="bold" fill="#111111" text-anchor="middle">The water cycle</text>

  <!-- 2 Condensation (kiri atas) -->
  <rect x="40" y="56" width="220" height="84" rx="8" fill="#F4F6F8" stroke="#333333" stroke-width="1.5"/>
  <text x="150" y="82" font-size="14.5" font-weight="bold" fill="#111111" text-anchor="middle">2 Condensation</text>
  <text x="150" y="104" font-size="12.5" fill="#111111" text-anchor="middle">The vapour cools high in the air</text>
  <text x="150" y="122" font-size="12.5" fill="#111111" text-anchor="middle">and forms clouds.</text>

  <!-- 3 Precipitation (kanan atas) -->
  <rect x="340" y="56" width="220" height="84" rx="8" fill="#F4F6F8" stroke="#333333" stroke-width="1.5"/>
  <text x="450" y="82" font-size="14.5" font-weight="bold" fill="#111111" text-anchor="middle">3 Precipitation</text>
  <text x="450" y="104" font-size="12.5" fill="#111111" text-anchor="middle">Water falls on the land</text>
  <text x="450" y="122" font-size="12.5" fill="#111111" text-anchor="middle">as rain or snow.</text>

  <!-- 1 Evaporation (kiri bawah) -->
  <rect x="40" y="262" width="220" height="84" rx="8" fill="#E3F3F3" stroke="#333333" stroke-width="1.5"/>
  <text x="150" y="288" font-size="14.5" font-weight="bold" fill="#111111" text-anchor="middle">1 Evaporation</text>
  <text x="150" y="310" font-size="12.5" fill="#111111" text-anchor="middle">The sun heats the sea and water</text>
  <text x="150" y="328" font-size="12.5" fill="#111111" text-anchor="middle">rises into the air as vapour.</text>

  <!-- 4 Collection (kanan bawah) -->
  <rect x="340" y="262" width="220" height="84" rx="8" fill="#F4F6F8" stroke="#333333" stroke-width="1.5"/>
  <text x="450" y="288" font-size="14.5" font-weight="bold" fill="#111111" text-anchor="middle">4 Collection</text>
  <text x="450" y="310" font-size="12.5" fill="#111111" text-anchor="middle">Rivers and groundwater carry</text>
  <text x="450" y="328" font-size="12.5" fill="#111111" text-anchor="middle">the water back to the sea.</text>

  <!-- panah searah jarum jam: 1 → 2 → 3 → 4 → 1 -->
  <line x1="150" y1="262" x2="150" y2="150" stroke="#333333" stroke-width="1.8" marker-end="url(#panah)"/>
  <line x1="260" y1="98" x2="330" y2="98" stroke="#333333" stroke-width="1.8" marker-end="url(#panah)"/>
  <line x1="450" y1="140" x2="450" y2="252" stroke="#333333" stroke-width="1.8" marker-end="url(#panah)"/>
  <line x1="340" y1="304" x2="270" y2="304" stroke="#333333" stroke-width="1.8" marker-end="url(#panah)"/>

  <!-- matahari di tengah -->
  <g stroke="#F2A65A" stroke-width="2.2" stroke-linecap="round">
    <line x1="300" y1="160" x2="300" y2="170"/>
    <line x1="300" y1="232" x2="300" y2="242"/>
    <line x1="259" y1="201" x2="269" y2="201"/>
    <line x1="331" y1="201" x2="341" y2="201"/>
    <line x1="271" y1="172" x2="278" y2="179"/>
    <line x1="322" y1="223" x2="329" y2="230"/>
    <line x1="271" y1="230" x2="278" y2="223"/>
    <line x1="322" y1="179" x2="329" y2="172"/>
  </g>
  <circle cx="300" cy="201" r="24" fill="#F9C784" stroke="#F2A65A" stroke-width="2"/>
  <text x="300" y="205.5" font-size="11.5" font-weight="bold" fill="#111111" text-anchor="middle">SUN</text>

  <!-- laut dan daratan -->
  <path d="M40 372 q14 -9 28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t28 0 t24 0" fill="none" stroke="#1A9E9E" stroke-width="2"/>
  <text x="150" y="392" font-size="11" fill="#555555" text-anchor="middle">SEA</text>
  <line x1="340" y1="372" x2="560" y2="372" stroke="#8A6D3B" stroke-width="2"/>
  <text x="450" y="392" font-size="11" fill="#555555" text-anchor="middle">LAND</text>
</svg>
