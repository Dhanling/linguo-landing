<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="600" height="420" fill="#FFFFFF"/>
  <rect x="8" y="8" width="584" height="404" fill="none" stroke="#333333" stroke-width="1.5"/>

  <!-- kepala formulir -->
  <rect x="8" y="8" width="584" height="62" fill="#EEF1F4" stroke="#333333" stroke-width="1.5"/>
  <text x="300" y="36" font-size="18" font-weight="bold" fill="#111111" text-anchor="middle" letter-spacing="1">RIVERBANK COMMUNITY CENTRE</text>
  <text x="300" y="58" font-size="13" fill="#333333" text-anchor="middle">Evening Course Enrolment Form</text>

  <!-- contoh -->
  <text x="34" y="100" font-size="12" font-style="italic" fill="#555555">Example</text>
  <text x="120" y="100" font-size="14" fill="#111111">Course:</text>
  <text x="270" y="100" font-size="14" fill="#111111" font-style="italic">Digital Photography (Wednesday evenings)</text>
  <line x1="30" y1="116" x2="570" y2="116" stroke="#999999" stroke-width="1"/>

  <!-- baris isian -->
  <text x="120" y="150" font-size="14" fill="#111111">Family name:</text>
  <text x="270" y="150" font-size="14" fill="#111111"><tspan font-weight="bold">(1)</tspan> ………………………………</text>

  <text x="120" y="190" font-size="14" fill="#111111">First name:</text>
  <text x="270" y="190" font-size="14" fill="#111111" font-style="italic">Daniel</text>

  <text x="120" y="230" font-size="14" fill="#111111">Address:</text>
  <text x="270" y="230" font-size="14" fill="#111111">42 <tspan font-weight="bold">(2)</tspan> ………………………… Road, Cowley</text>

  <text x="120" y="270" font-size="14" fill="#111111">Daytime telephone:</text>
  <text x="270" y="270" font-size="14" fill="#111111">01865 <tspan font-weight="bold">(3)</tspan> ………………………</text>

  <text x="120" y="310" font-size="14" fill="#111111">Occupation:</text>
  <text x="270" y="310" font-size="14" fill="#111111"><tspan font-weight="bold">(4)</tspan> ………………………………</text>

  <text x="120" y="350" font-size="14" fill="#111111">Course begins:</text>
  <text x="270" y="350" font-size="14" fill="#111111">Wednesday <tspan font-weight="bold">(5)</tspan> ……………… October</text>

  <line x1="30" y1="372" x2="570" y2="372" stroke="#999999" stroke-width="1"/>
  <text x="300" y="396" font-size="11" fill="#555555" text-anchor="middle">Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.</text>
