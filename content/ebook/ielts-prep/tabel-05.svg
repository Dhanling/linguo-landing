<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="600" height="300" fill="#FFFFFF"/>

  <text x="300" y="26" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">Two kinds of concrete</text>

  <!-- kerangka tabel: kolom 10–130 | 130–365 | 365–590 -->
  <rect x="10" y="42" width="580" height="44" fill="#EEF1F4" stroke="#333333" stroke-width="1.5"/>
  <rect x="10" y="42" width="580" height="236" fill="none" stroke="#333333" stroke-width="1.5"/>
  <line x1="130" y1="42" x2="130" y2="278" stroke="#333333" stroke-width="1.2"/>
  <line x1="365" y1="42" x2="365" y2="278" stroke="#333333" stroke-width="1.2"/>
  <line x1="10" y1="150" x2="590" y2="150" stroke="#333333" stroke-width="1"/>
  <line x1="10" y1="214" x2="590" y2="214" stroke="#333333" stroke-width="1"/>

  <!-- kepala -->
  <text x="247" y="61" font-size="13" font-weight="bold" fill="#111111" text-anchor="middle">ROMAN MARINE</text>
  <text x="247" y="77" font-size="13" font-weight="bold" fill="#111111" text-anchor="middle">CONCRETE</text>
  <text x="477" y="61" font-size="13" font-weight="bold" fill="#111111" text-anchor="middle">MODERN REINFORCED</text>
  <text x="477" y="77" font-size="13" font-weight="bold" fill="#111111" text-anchor="middle">CONCRETE</text>

  <!-- baris 1: binder -->
  <text x="22" y="122" font-size="14" font-weight="bold" fill="#111111">Binder</text>
  <text x="142" y="110" font-size="13.5" fill="#111111">forms when lime and water</text>
  <text x="142" y="130" font-size="13.5" fill="#111111">react with volcanic <tspan font-weight="bold">(11)</tspan> ………</text>
  <text x="377" y="110" font-size="13.5" fill="#111111">calcium-silicate-hydrate,</text>
  <text x="377" y="130" font-size="13.5" fill="#111111">produced by Portland cement</text>

  <!-- baris 2: seawater -->
  <text x="22" y="187" font-size="14" font-weight="bold" fill="#111111">Seawater</text>
  <text x="142" y="187" font-size="13.5" fill="#111111">behaves as an <tspan font-weight="bold">(12)</tspan> ………………</text>
  <text x="377" y="187" font-size="13.5" fill="#111111">treated as an enemy</text>

  <!-- baris 3: weakness -->
  <text x="22" y="240" font-size="14" font-weight="bold" fill="#111111">Main</text>
  <text x="22" y="258" font-size="14" font-weight="bold" fill="#111111">weakness</text>
  <text x="142" y="240" font-size="13.5" fill="#111111">no reinforcement, so no thin</text>
  <text x="142" y="258" font-size="13.5" fill="#111111">beams or long spans</text>
  <text x="377" y="240" font-size="13.5" fill="#111111">corrosion of the <tspan font-weight="bold">(13)</tspan> ………</text>
  <text x="377" y="258" font-size="13.5" fill="#111111">inside the material</text>

  <text x="300" y="294" font-size="11" fill="#555555" text-anchor="middle">Choose ONE WORD ONLY from the passage for each answer.</text>
</svg>
