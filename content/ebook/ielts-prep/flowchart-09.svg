<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 640" width="600" height="640" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="600" height="640" fill="#FFFFFF"/>
  <defs>
    <marker id="panah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#333333"/>
    </marker>
  </defs>

  <text x="300" y="34" font-size="18" font-weight="bold" fill="#111111" text-anchor="middle">Larval seeding, step by step</text>

  <!-- 1 -->
  <rect x="50" y="56" width="500" height="64" rx="6" fill="#F4F6F8" stroke="#333333" stroke-width="1.5"/>
  <text x="300" y="83" font-size="14" fill="#111111" text-anchor="middle">Divers predict the night of mass spawning</text>
  <text x="300" y="105" font-size="14" fill="#111111" text-anchor="middle">using the <tspan font-weight="bold">(6)</tspan> ……………………… cycle.</text>
  <line x1="300" y1="120" x2="300" y2="146" stroke="#333333" stroke-width="1.5" marker-end="url(#panah)"/>

  <!-- 2 -->
  <rect x="50" y="150" width="500" height="64" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="300" y="177" font-size="14" fill="#111111" text-anchor="middle">Colonies release bundles of eggs and sperm,</text>
  <text x="300" y="199" font-size="14" fill="#111111" text-anchor="middle">which float to the surface.</text>
  <line x1="300" y1="214" x2="300" y2="240" stroke="#333333" stroke-width="1.5" marker-end="url(#panah)"/>

  <!-- 3 -->
  <rect x="50" y="244" width="500" height="64" rx="6" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="300" y="271" font-size="14" fill="#111111" text-anchor="middle">The bundles are skimmed into floating pools,</text>
  <text x="300" y="293" font-size="14" fill="#111111" text-anchor="middle">where fertilisation takes place.</text>
  <line x1="300" y1="308" x2="300" y2="334" stroke="#333333" stroke-width="1.5" marker-end="url(#panah)"/>

  <!-- 4 -->
  <rect x="50" y="338" width="500" height="64" rx="6" fill="#F4F6F8" stroke="#333333" stroke-width="1.5"/>
  <text x="300" y="365" font-size="14" fill="#111111" text-anchor="middle">The embryos are reared for about five days, until</text>
  <text x="300" y="387" font-size="14" fill="#111111" text-anchor="middle">the larvae are ready to <tspan font-weight="bold">(7)</tspan> ……………………… .</text>
  <line x1="300" y1="402" x2="300" y2="428" stroke="#333333" stroke-width="1.5" marker-end="url(#panah)"/>

  <!-- 5 -->
  <rect x="50" y="432" width="500" height="64" rx="6" fill="#F4F6F8" stroke="#333333" stroke-width="1.5"/>
  <text x="300" y="459" font-size="14" fill="#111111" text-anchor="middle">The larvae are released over damaged reef and kept</text>
  <text x="300" y="481" font-size="14" fill="#111111" text-anchor="middle">in place under fine <tspan font-weight="bold">(8)</tspan> ……………………… tents.</text>
  <line x1="300" y1="496" x2="300" y2="522" stroke="#333333" stroke-width="1.5" marker-end="url(#panah)"/>

  <!-- 6 -->
  <rect x="50" y="526" width="500" height="64" rx="6" fill="#F4F6F8" stroke="#333333" stroke-width="1.5"/>
  <text x="300" y="553" font-size="14" fill="#111111" text-anchor="middle">After six months, divers count</text>
  <text x="300" y="575" font-size="14" fill="#111111" text-anchor="middle">the surviving <tspan font-weight="bold">(9)</tspan> ……………………… .</text>

  <text x="300" y="622" font-size="11" fill="#555555" text-anchor="middle">Shaded boxes contain a gap. Choose ONE WORD ONLY from the passage for each answer.</text>
</svg>
