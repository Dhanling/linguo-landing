<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="600" height="360" fill="#FFFFFF"/>
  <defs>
    <pattern id="gambut" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#EFE6D8"/>
      <path d="M0 10 L10 0" stroke="#C9B79A" stroke-width="1"/>
    </pattern>
    <marker id="panah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#333333"/>
    </marker>
  </defs>

  <text x="300" y="24" font-size="16" font-weight="bold" fill="#111111" text-anchor="middle">A peatland before and after restoration</text>

  <!-- ══ PANEL KIRI: dikeringkan ══ -->
  <rect x="10" y="40" width="284" height="300" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="152" y="62" font-size="13" font-weight="bold" fill="#111111" text-anchor="middle">DRAINED</text>

  <!-- lapisan gambut dengan parit berbentuk V -->
  <path d="M10 170 L120 170 L140 230 L160 230 L180 170 L294 170 L294 300 L10 300 Z" fill="url(#gambut)" stroke="#333333" stroke-width="1.5"/>
  <rect x="10" y="300" width="284" height="40" fill="#D9D9D9" stroke="#333333" stroke-width="1"/>
  <text x="152" y="325" font-size="11" fill="#333333" text-anchor="middle">rock / clay</text>
  <text x="40" y="200" font-size="12" fill="#333333">peat</text>

  <!-- muka air rendah -->
  <line x1="10" y1="255" x2="294" y2="255" stroke="#2A6F97" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="284" y="274" font-size="11" fill="#2A6F97" text-anchor="end">water table lowered</text>

  <!-- panah dari udara -->
  <line x1="220" y1="86" x2="220" y2="160" stroke="#333333" stroke-width="1.5" marker-end="url(#panah)"/>
  <line x1="250" y1="86" x2="250" y2="160" stroke="#333333" stroke-width="1.5" marker-end="url(#panah)"/>
  <text x="24" y="98" font-size="12.5" fill="#111111"><tspan font-weight="bold">(7)</tspan> ………………</text>
  <text x="24" y="116" font-size="12.5" fill="#111111">reaches the peat</text>
  <line x1="80" y1="122" x2="212" y2="130" stroke="#777777" stroke-width="1"/>

  <!-- karbon keluar -->
  <line x1="60" y1="162" x2="60" y2="134" stroke="#8A5A2B" stroke-width="1.5" marker-end="url(#panah)"/>
  <text x="68" y="150" font-size="10.5" fill="#8A5A2B">carbon released</text>

  <!-- ══ PANEL KANAN: dipulihkan ══ -->
  <rect x="306" y="40" width="284" height="300" fill="none" stroke="#333333" stroke-width="1.5"/>
  <text x="448" y="62" font-size="13" font-weight="bold" fill="#111111" text-anchor="middle">RESTORED</text>

  <path d="M306 170 L416 170 L436 230 L456 230 L476 170 L590 170 L590 300 L306 300 Z" fill="url(#gambut)" stroke="#333333" stroke-width="1.5"/>
  <rect x="306" y="300" width="284" height="40" fill="#D9D9D9" stroke="#333333" stroke-width="1"/>
  <text x="448" y="325" font-size="11" fill="#333333" text-anchor="middle">rock / clay</text>
  <text x="336" y="200" font-size="12" fill="#333333">peat</text>

  <!-- bendung kecil mengisi parit, air di belakangnya -->
  <path d="M419 178 L433 222 L459 222 L473 178 Z" fill="#B5E0F0" stroke="none"/>
  <path d="M430 170 L462 170 L456 230 L436 230 Z" fill="#9C7A4F" stroke="#333333" stroke-width="1.2"/>
  <line x1="306" y1="176" x2="590" y2="176" stroke="#2A6F97" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="496" y="194" font-size="11" fill="#2A6F97">water table raised</text>

  <!-- label bendung -->
  <text x="320" y="98" font-size="12.5" fill="#111111">small dam blocks the</text>
  <text x="320" y="116" font-size="12.5" fill="#111111"><tspan font-weight="bold">(9)</tspan> ………………</text>
  <line x1="390" y1="122" x2="444" y2="168" stroke="#777777" stroke-width="1" marker-end="url(#panah)"/>

  <!-- lumut ditanam ulang -->
  <path d="M500 170 q4 -14 8 0 q4 -14 8 0 q4 -14 8 0" fill="none" stroke="#3C8A3C" stroke-width="2"/>
  <path d="M540 170 q4 -14 8 0 q4 -14 8 0" fill="none" stroke="#3C8A3C" stroke-width="2"/>
  <text x="498" y="140" font-size="10.5" fill="#3C8A3C">moss replanted</text>
  <text x="498" y="153" font-size="10.5" fill="#3C8A3C">by hand</text>
</svg>
