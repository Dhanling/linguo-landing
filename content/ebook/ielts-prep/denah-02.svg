<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="600" height="380" fill="#FFFFFF"/>
  <rect x="8" y="8" width="584" height="364" fill="none" stroke="#333333" stroke-width="1.5"/>

  <!-- woodland -->
  <rect x="26" y="26" width="184" height="74" fill="#EFF3EE" stroke="#555555" stroke-width="1" stroke-dasharray="5 3"/>
  <circle cx="52" cy="52" r="9" fill="none" stroke="#555555" stroke-width="1"/>
  <circle cx="76" cy="70" r="9" fill="none" stroke="#555555" stroke-width="1"/>
  <circle cx="100" cy="48" r="9" fill="none" stroke="#555555" stroke-width="1"/>
  <text x="130" y="66" font-size="13" fill="#333333">WOODLAND</text>

  <!-- lake -->
  <ellipse cx="480" cy="245" rx="95" ry="80" fill="#E8F0F5" stroke="#333333" stroke-width="1.5"/>
  <text x="480" y="250" font-size="15" fill="#333333" text-anchor="middle">LAKE</text>

  <!-- paths -->
  <rect x="88" y="120" width="24" height="240" fill="#F0EDE4" stroke="#333333" stroke-width="1.2"/>
  <rect x="88" y="108" width="422" height="24" fill="#F0EDE4" stroke="#333333" stroke-width="1.2"/>
  <rect x="288" y="120" width="24" height="190" fill="#F0EDE4" stroke="#333333" stroke-width="1.2"/>

  <!-- fence across the top of the main path -->
  <line x1="30" y1="104" x2="212" y2="104" stroke="#333333" stroke-width="2" stroke-dasharray="2 4"/>
  <text x="216" y="100" font-size="10" fill="#333333">fenced off</text>

  <!-- path labels -->
  <text x="118" y="330" font-size="11" fill="#333333">main path</text>
  <text x="392" y="102" font-size="11" fill="#333333">upper path</text>
  <text x="318" y="300" font-size="11" fill="#333333">narrow path</text>

  <!-- lettered locations -->
  <rect x="40" y="278" width="32" height="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="56" y="295" font-size="14" fill="#111111" text-anchor="middle">A</text>

  <rect x="128" y="278" width="32" height="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="144" y="295" font-size="14" fill="#111111" text-anchor="middle">B</text>

  <rect x="40" y="168" width="32" height="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="56" y="185" font-size="14" fill="#111111" text-anchor="middle">C</text>

  <rect x="128" y="168" width="32" height="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="144" y="185" font-size="14" fill="#111111" text-anchor="middle">D</text>

  <rect x="234" y="52" width="32" height="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="250" y="69" font-size="14" fill="#111111" text-anchor="middle">E</text>

  <rect x="364" y="52" width="32" height="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="380" y="69" font-size="14" fill="#111111" text-anchor="middle">F</text>

  <rect x="234" y="203" width="32" height="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="250" y="220" font-size="14" fill="#111111" text-anchor="middle">H</text>

  <rect x="334" y="203" width="32" height="24" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
  <text x="350" y="220" font-size="14" fill="#111111" text-anchor="middle">G</text>

  <!-- hedge between the lower and upper part of the main path -->
  <line x1="40" y1="228" x2="88" y2="228" stroke="#555555" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="112" y1="228" x2="164" y2="228" stroke="#555555" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="168" y="232" font-size="10" fill="#333333">end of hedge</text>

  <!-- entrance -->
  <polygon points="100,372 92,356 108,356" fill="#333333"/>
  <text x="118" y="366" font-size="12" fill="#111111">MAIN ENTRANCE</text>

  <!-- compass -->
  <line x1="556" y1="66" x2="556" y2="30" stroke="#333333" stroke-width="1.5"/>
  <polygon points="556,26 551,38 561,38" fill="#333333"/>
  <text x="556" y="80" font-size="12" fill="#111111" text-anchor="middle">N</text>

  <text x="16" y="24" font-size="11" fill="#555555">Ashmere Country Park — visitor plan</text>
</svg>
